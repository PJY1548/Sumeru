            flex: 1; padding: 0.75rem; text-align: center; cursor: pointer;
            background: none; border: none; font-size: 0.95rem; color: #64748b;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 500; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; color: #334155; font-size: 0.9rem; }
        input {
            width: 100%; padding: 0.6rem 0.8rem; border: 1px solid rgba(148, 163, 184, 0.5);
            border-radius: 8px; font-size: 0.95rem; transition: all 0.2s;
            background: rgba(255, 255, 255, 0.6);
        }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 0.3rem; }
        button[type="submit"] {
            width: 100%; padding: 0.7rem; background: #3b82f6; color: white;
            border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
            margin-top: 0.5rem; transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #2563eb; }
        button[type="submit"]:disabled { background: #93c5fd; cursor: not-allowed; }
        .message {
            padding: 0.7rem 0.9rem; border-radius: 8px; margin-top: 1rem;
            font-size: 0.9rem; display: none;
        }
        .message.error { background: rgba(254, 242, 242, 0.75); color: #b91c1c; border: 1px solid rgba(254, 202, 202, 0.5); display: block; }
        .message.success { background: rgba(240, 253, 244, 0.75); color: #15803d; border: 1px solid rgba(187, 247, 208, 0.5); display: block; }
        .logged-in { text-align: center; }
        .logged-in button { margin-top: 1rem; }

        /* ===== 统一导航 ===== */
        .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
        #bgLayer {
            position: fixed; inset: 0; z-index: -1;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #0f172a;
        }
        header#mainHeader {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
            position: sticky; top: 0; z-index: 50;
        }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            height: 60px;
        }
        .logo {
            font-size: 1.2rem; font-weight: bold; color: #3b82f6;
            text-decoration: none; display: flex; align-items: center;
        }
        .logo i { font-size: 1.5rem; margin-right: 0.4rem; font-weight: normal; }
        .nav-links { display: flex; list-style: none; gap: 1.5rem; margin: 0; padding: 0; align-items: center; }
        .nav-links a { text-decoration: none; color: #475569; font-size: 0.95rem; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #3b82f6; }
        .nav-links a.active { font-weight: 500; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.2rem; color: #475569; cursor: pointer; }
        .mobile-menu {
            position: fixed; top: 60px; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 100;
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out;
        }
        .mobile-menu-content { padding: 1rem; width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
        .mobile-menu.active { max-height: 340px; transition: max-height 0.5s ease-in; }
        .mobile-menu a {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 0;
            text-decoration: none; color: #475569;
            border-bottom: 1px solid rgba(100, 116, 139, 0.15); transition: all 0.3s ease;
        }
        .mobile-menu a:last-child { border-bottom: none; }
        .mobile-menu a:hover { color: #3b82f6; padding-left: 8px; }
        .mobile-menu-btn i { transition: transform 0.3s ease; }
        .mobile-menu-btn.open i { transform: rotate(90deg); }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
        }

        .nav-user { margin-left: 1.5rem; position: relative; display: flex; align-items: center; }
        .btn-login-nav {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.45rem 1.1rem; border-radius: 999px;
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6; text-decoration: none;
            font-size: 0.9rem; font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.25);
            transition: all 0.2s;
        }
        .btn-login-nav:hover { background: #3b82f6; color: #fff; transform: translateY(-1px); }
        /* 移动端菜单登录按钮：恢复胶囊样式、文字居中 */
        .mobile-menu a.btn-login-nav {
            display: inline-flex;
            justify-content: center;
            padding: 0.45rem 1.1rem;
            margin: 0.4rem 0;
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-bottom: none;
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
            border-radius: 999px;
            text-align: center;
        }
        .mobile-menu a.btn-login-nav:hover {
            background: #3b82f6;
            color: #fff;
            padding-left: 1.1rem;
        }
        .user-menu { position: relative; }
        .user-menu-trigger {
            display: inline-flex; align-items: center; gap: 0.45rem;
            cursor: pointer; padding: 0.25rem 0.4rem; border-radius: 999px;
            text-decoration: none; transition: background 0.2s;
        }
        .user-menu-trigger:hover { background: rgba(59, 130, 246, 0.08); }
        .user-avatar-small {
            width: 30px; height: 30px; border-radius: 50%;
            background: #3b82f6; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.85rem; overflow: hidden; flex-shrink: 0;
        }
        .user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
        .user-menu-trigger span { color: #1e293b; font-weight: 500; font-size: 0.9rem; }
        .user-dropdown {
            position: absolute; top: calc(100% + 0.5rem); right: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
            min-width: 170px; padding: 0.4rem;
            opacity: 0; visibility: hidden; transform: translateY(-5px);
            transition: all 0.2s; z-index: 200;
        }
        .user-menu.open .user-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        .user-dropdown a, .user-dropdown button {
            display: flex; align-items: center; gap: 0.6rem;
            width: 100%; padding: 0.55rem 0.8rem;
            color: #475569; text-decoration: none; font-size: 0.9rem;
            background: none; border: none; cursor: pointer; text-align: left;
            border-radius: 8px; transition: background 0.15s;
        }
        .user-dropdown a:hover, .user-dropdown button:hover { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .user-dropdown i { width: 16px; text-align: center; }
        .user-dropdown .divider { height: 1px; background: rgba(100, 116, 139, 0.2); margin: 0.35rem 0; }
        .mobile-user-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; font-weight: 600; color: #1e293b; }
        .mobile-nav-link { gap: 0.5rem; }

        /* ===== 页脚 / Toast ===== */
        .site-footer {
            margin-top: auto; padding: 2.5rem 1.5rem; text-align: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
        }
        .site-footer .footer-quote {
            font-size: 0.95rem; max-width: 760px; margin: 0 auto 0.6rem;
            line-height: 1.7; display: flex; align-items: flex-start; justify-content: center; gap: 0.5rem;
            color: #334155;
        }
        .site-footer .footer-quote i { color: #3b82f6; margin-top: 0.15rem; }
        .site-footer .footer-built { font-size: 0.8rem; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 0.35rem; }
        .app-toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            padding: 0.7rem 1.5rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
            opacity: 0; visibility: hidden;
            transition: all 0.3s; z-index: 9999;
            color: #1e293b; font-size: 0.9rem;
            max-width: 80vw; text-align: center;
        }
        .app-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    </style>
</head>
<body>
    <!-- 背景层 -->
    <div id="bgLayer"></div>
    <!-- 统一导航栏 -->
    <header id="mainHeader">
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <i class="iconfont icon-xumi"></i>
                    <span>Sumeru</span>
                </a>
                <ul class="nav-links">
                    <li><a href="/">首页</a></li>
                    <li><a href="/posts">所有文章</a></li>
                    <li class="nav-user" id="navUserDesktop"></li>
                </ul>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fa fa-bars"></i>
                </button>
            </nav>
            <div class="mobile-menu" id="mobileMenu">
                <div class="mobile-menu-content">
                    <a href="/">首页</a>
                    <a href="/posts">所有文章</a>
                    <div id="navUserMobile"></div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="card-box" id="mainBox">
        <h1>Sumeru</h1>
        <p class="subtitle">分享你的思考与探索</p>

        <div class="tabs">
            <button class="tab active" data-tab="login">登录</button>
            <button class="tab" data-tab="register">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="login-form">
            <div class="form-group">
                <label>用户名 / 邮箱</label>
                <input type="text" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit">登录</button>
            <div class="message" id="login-message"></div>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" style="display:none">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" autocomplete="username" required>
                <div class="hint">3-20 位，字母 / 数字 / 下划线 / 中文</div>
            </div>
            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" name="email" autocomplete="email">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" autocomplete="new-password" required minlength="8">
                <div class="hint">至少 8 位</div>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirm_password" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit">注册</button>
            <div class="message" id="register-message"></div>
        </form>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-quote">
            <span id="footerSentence">加载中...</span>
        </div>
        <div class="footer-built">
            <i class="iconfont icon-Cloud"></i> 由 Cloudflare Worker 构建
        </div>
    </footer>

    <script>
        // ==================== 移动端菜单 ====================
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobileMenu');
            const open = mobileMenu.classList.toggle('active');
            this.classList.toggle('open', open);
        });

        // ==================== 全局：导航 / 背景 / 页脚 / Toast ====================
        const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        const userInitial = (username) => (username || '?').charAt(0).toUpperCase();
        const currentPath = window.location.pathname + window.location.search;

        function showToast(msg) {
            let toast = document.getElementById('app-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'app-toast';
                toast.className = 'app-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function applyBackground() {
            const layer = document.getElementById('bgLayer');
            if (!layer) return;
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            const key = isMobile ? 'bg_mp' : 'bg_pc';
            const t = isMobile ? 'mp' : 'pc';
            let cached = null;
            try { cached = localStorage.getItem(key); } catch (e) {}
            if (cached) {
                layer.style.backgroundImage = `url("${cached}")`;
                return;
            }
            // 通过 Worker 代理解析最终图片 URL（规避 CORS，可稳定缓存到 localStorage）
            fetch(`/api/bg?t=${t}`)
                .then((r) => r.json())
                .then((data) => {
                    if (data && data.success && data.data && data.data.url) {
                        try { localStorage.setItem(key, data.data.url); } catch (e) {}
                        layer.style.backgroundImage = `url("${data.data.url}")`;
                    } else {
                        setDirectBg();
                    }
                })
                .catch(setDirectBg);

            function setDirectBg() {
                const api = isMobile ? 'https://t.alcy.cc/mp' : 'https://t.alcy.cc/pc';
                const img = new Image();
                img.referrerPolicy = 'no-referrer';
                img.onload = () => {
                    const finalUrl = img.currentSrc || api;
                    try { localStorage.setItem(key, finalUrl); } catch (e) {}
                    layer.style.backgroundImage = `url("${finalUrl}")`;
                };
                img.onerror = () => { layer.style.backgroundImage = `url("${api}")`; };
                img.src = api;
            }
        }

        async function loadFooterSentence() {
            const el = document.getElementById('footerSentence');
            if (!el) return;
            try {
                const res = await fetch('/api/sentence');
                if (!res.ok) throw new Error('bad status');
                const text = await res.text();
                const clean = String(text || '').trim().replace(/\s+/g, ' ').slice(0, 200);
                el.textContent = clean || '以梦为马，不负韶华。';
            } catch (e) {
                el.textContent = '以梦为马，不负韶华。';
            }
        }

        // ===== 导航登录态 =====
        let navUser = null;
        async function fetchNavUser() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                const data = await res.json();
                if (data.success) navUser = data.data;
            } catch (e) { /* 未登录静默 */ }
            renderNavUser();
        }

        function renderNavUser() {
            const desktop = document.getElementById('navUserDesktop');
            const mobile = document.getElementById('navUserMobile');
            if (!desktop && !mobile) return;
            if (navUser) {
                const avatar = navUser.avatar_url
                    ? `<img src="${escapeHtml(navUser.avatar_url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove();">`
                    : userInitial(navUser.username);
                if (desktop) desktop.innerHTML = `
                    <div class="user-menu" id="userMenuDesktop">
                        <a href="javascript:void(0)" class="user-menu-trigger" onclick="toggleUserMenu('userMenuDesktop')">
                            <div class="user-avatar-small">${avatar}</div>
                            <span>${escapeHtml(navUser.username)}</span>
                            <i class="fa fa-caret-down" style="font-size:0.75rem;color:#94a3b8;"></i>
                        </a>
                        <div class="user-dropdown">
                            <a href="/profile"><i class="fa fa-user"></i>个人中心</a>
                            <div class="divider"></div>
                            <button onclick="handleLogout()"><i class="fa fa-sign-out"></i>退出登录</button>
                        </div>
                    </div>`;
                if (mobile) mobile.innerHTML = `
                    <div class="mobile-user-row">
                        <div class="user-avatar-small">${avatar}</div>
                        <span>${escapeHtml(navUser.username)}</span>
                    </div>
                    <a href="/profile" class="mobile-nav-link"><i class="fa fa-user"></i>个人中心</a>
                    <a href="javascript:void(0)" class="mobile-nav-link" onclick="handleLogout()" style="color:#ef4444;"><i class="fa fa-sign-out"></i>退出登录</a>`;
            } else {
                const loginHtml = `<a href="/login?redirect=${encodeURIComponent(currentPath)}" class="btn-login-nav"><i class="fa fa-key"></i>登录</a>`;
                if (desktop) desktop.innerHTML = loginHtml;
                if (mobile) mobile.innerHTML = loginHtml;
            }
        }

        function toggleUserMenu(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const wasOpen = el.classList.contains('open');
            document.querySelectorAll('.user-menu').forEach(m => m.classList.remove('open'));
            if (!wasOpen) el.classList.add('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-menu')) {
                document.querySelectorAll('.user-menu').forEach(m => m.classList.remove('open'));
            }
        });

        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
            navUser = null;
            renderNavUser();
            showToast('已退出登录');
            setTimeout(() => { window.location.href = '/'; }, 600);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyBackground();
            loadFooterSentence();
            fetchNavUser();
        });

        // Tab 切换
        document.querySelectorAll('.tab').forEach((tab) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.tab;
                document.getElementById('login-form').style.display = target === 'login' ? 'block' : 'none';
                document.getElementById('register-form').style.display = target === 'register' ? 'block' : 'none';
            });
        });

        // 显示消息
        const showMessage = (elId, type, text) => {
            const el = document.getElementById(elId);
            el.className = `message ${type}`;
            el.textContent = text;
        };

        const setButtonLoading = (form, loading) => {
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = loading;
            btn.textContent = loading ? '处理中...' : (form.id === 'login-form' ? '登录' : '注册');
        };

        // 登录
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            setButtonLoading(form, true);
            try {
                const data = Object.fromEntries(new FormData(form));
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    credentials: 'include',
                });
                const result = await res.json();
                if (result.success) {
                    showMessage('login-message', 'success', '登录成功，正在跳转...');
                    setTimeout(() => {
                        const url = new URL(window.location.href);
                        const redirect = url.searchParams.get('redirect') || '/';
                        window.location.href = redirect;
                    }, 800);
                } else {
                    showMessage('login-message', 'error', result.message || '登录失败');
                    setButtonLoading(form, false);
                }
            } catch (err) {
                showMessage('login-message', 'error', '网络错误，请重试');
                setButtonLoading(form, false);
            }
        });

        // 注册
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            if (data.password !== data.confirm_password) {
                showMessage('register-message', 'error', '两次输入的密码不一致');
                return;
            }
            setButtonLoading(form, true);
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: data.username,
                        email: data.email || undefined,
                        password: data.password,
                    }),
                    credentials: 'include',
                });
                const result = await res.json();
                if (result.success) {
                    showMessage('register-message', 'success', '注册成功，正在跳转...');
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    showMessage('register-message', 'error', result.message || '注册失败');
                    setButtonLoading(form, false);
                }
            } catch (err) {
                showMessage('register-message', 'error', '网络错误，请重试');
                setButtonLoading(form, false);
            }
        });

        // 检查是否已登录
        (async () => {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    const redirect = new URL(window.location.href).searchParams.get('redirect') || '/';
                    document.getElementById('mainBox').innerHTML = `
                        <h1>已登录</h1>
                        <p class="subtitle">欢迎回来，${data.data.username}</p>
                        <div class="logged-in">
                            <button type="button" onclick="window.location.href='${redirect}'">前往${redirect === '/' ? '首页' : redirect}</button>
                            <button type="button" onclick="logout()" style="background:#ef4444;margin-top:0.5rem">退出登录</button>
                        </div>
                    `;
                }
            } catch (e) { /* 未登录，静默 */ }
        })();

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.reload();
        }
    </script>
</body>
</html>
